<!-- Subject: Reset your password — Mbopo Akwa Ibom -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mbopo Akwa Ibom</title>
  </head>
  <body
    style="
      margin: 0;
      padding: 0;
      background-color: #fdf8f4;
      font-family: Arial, sans-serif;
      color: #2a2523;
    "
  >
    <table
      cellpadding="0"
      cellspacing="0"
      border="0"
      width="100%"
      style="background-color: #fdf8f4; padding: 20px 0"
    >
      <tr>
        <td align="center">
          <table
            cellpadding="0"
            cellspacing="0"
            border="0"
            width="600"
            style="
              background-color: #ffffff;
              border-radius: 8px;
              overflow: hidden;
            "
          >
            <!-- Header -->
            <tr>
              <td
                align="center"
                bgcolor="#e77818"
                style="padding: 30px; color: #ffffff"
              >
                <h1 style="margin: 0; font-size: 20px">Mbopo Akwa Ibom</h1>
              </td>
            </tr>

            <!-- Message Section -->
            <tr>
              <td style="padding: 40px 30px 10px 30px">
                <p
                  style="
                    font-size: 16px;
                    color: #78716e;
                    line-height: 1.6;
                    margin: 0 0 20px 0;
                  "
                >
                  We received a request to reset your Mbopo Akwa Ibom account
                  password.<br /><br />
                  This link expires in 1 hour. If you didn't request this, you
                  can safely ignore this email.
                </p>
              </td>
            </tr>

            <!-- Action Button -->

            <tr>
              <td align="center" style="padding: 0 30px 30px 30px">
                <a
                  href="https://mbopo.example.com/reset-password?token=sample-token"
                  target="_blank"
                  style="
                    display: inline-block;
                    background-color: #e77818;
                    color: #ffffff;
                    text-decoration: none;
                    padding: 12px 24px;
                    border-radius: 6px;
                    font-size: 16px;
                    font-weight: bold;
                  "
                >
                  Reset Password
                </a>
              </td>
            </tr>

            <!-- Footer -->
            <tr>
              <td
                align="center"
                style="
                  padding: 20px 30px 40px 30px;
                  border-top: 1px solid #f2f0ed;
                "
              >
                <p
                  style="
                    font-size: 12px;
                    opacity: 0.7;
                    margin-top: 20px;
                    color: #78716e;
                  "
                >
                  &copy; 2026 Akwa Ibom State Hotels and Tourism Development
                  Commission. All rights reserved.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
